[build]
  publish = "dist"
  command = "npm run build && cp public/_redirects dist/ || true"

[build.environment]
  NODE_VERSION = "18"
  NPM_CONFIG_TIMEOUT = "300000"
  NPM_CONFIG_FETCH_TIMEOUT = "300000"
  NPM_CONFIG_FETCH_RETRIES = "5"
  NPM_CONFIG_PROGRESS = "false"
  NPM_CONFIG_AUDIT = "false"
  NPM_CONFIG_FUND = "false"

# Handle clean URLs for HTML pages
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
  force = false

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-src https://www.google.com;"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
